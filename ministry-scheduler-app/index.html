<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ministry Scheduler</title>
<meta name="theme-color" content="#23211D" />
<meta name="description" content="Assign volunteers and catch double-bookings across ministry teams." />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Scheduler" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; }
  * { box-sizing: border-box; }
  body { background: #F6F1E4; }
  input:focus { border-color: #A9782F !important; }
  button { transition: opacity 0.15s ease; cursor: pointer; }
  button:hover { opacity: 0.85; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

// ============================================================
// Ministry Scheduler — standalone installable version, synced
// live across everyone using it via Firebase Realtime Database.
// ============================================================

// ---- 1) PASTE YOUR FIREBASE CONFIG HERE ----
// Get this from: Firebase Console > Project settings > General >
// "Your apps" > Web app > SDK setup and configuration > Config.
// See README.txt for the full walkthrough.
const firebaseConfig = {
  apiKey: "AIzaSyDXePNefGXSH9OyvdnV1j0A1-13IM4QDQQ",
  authDomain: "ministry-scheduler-7b834.firebaseapp.com",
  databaseURL: "https://ministry-scheduler-7b834-default-rtdb.firebaseio.com",
  projectId: "ministry-scheduler-7b834",
  storageBucket: "ministry-scheduler-7b834.firebasestorage.app",
  messagingSenderId: "854617979344",
  appId: "1:854617979344:web:f012af287911307547e1d5",
};

const FIREBASE_CONFIGURED = !Object.values(firebaseConfig).some(
  (v) => typeof v === "string" && v.startsWith("PASTE_YOUR")
);

let stateRef = null;
if (FIREBASE_CONFIGURED) {
  firebase.initializeApp(firebaseConfig);
  stateRef = firebase.database().ref("ministry-scheduler-state");
}

const STORAGE_KEY = "ministry-scheduler-state-v1";
const SLOTS = ["9:00 AM", "11:00 AM"];
const WEEKS = [1, 2, 3, 4, 5];

const DEFAULT_TEAMS = [
  { id: "admin", name: "Service Lead", flexible: false, roles: [
      { id: "flow", name: "Program Flow" },
      { id: "encouragement", name: "Word of Encouragement" },
      { id: "ctw", name: "Call to Worship" },
      { id: "giving", name: "Giving" },
      { id: "word", name: "Word" },
      { id: "benediction", name: "Benediction" },
  ]},
  { id: "music", name: "Worship Team", flexible: false, roles: [
      { id: "worship-leader", name: "Worship Leader" },
      { id: "song-leader", name: "Song Leader" },
      { id: "guitar", name: "Guitar" },
      { id: "drums", name: "Drums" },
  ]},
  { id: "kids", name: "Kids Ministry", flexible: false, roles: [
      { id: "teacher", name: "Teacher" },
      { id: "asst-teacher", name: "Assistant Teacher" },
      { id: "huddle", name: "Huddle Leader" },
  ]},
  { id: "tech", name: "Tech Team", flexible: false, roles: [
      { id: "tech", name: "Tech / Sound" },
  ]},
  { id: "ushers", name: "Ushers", flexible: false, roles: [
      { id: "leader", name: "Team Leader" },
      { id: "parking", name: "Parking" },
      { id: "greeting", name: "Greeting" },
  ]},
  { id: "prayer", name: "Prayer Team", flexible: true, roles: [
      { id: "prayer", name: "Prayer" },
  ]},
];

const uid = () => Math.random().toString(36).slice(2, 10);
const norm = (s) => (s || "").toString().trim();
const normKey = (s) => norm(s).toLowerCase();
const pairKey = (a, b) => [a, b].sort().join("~");
const assignKey = (week, slot, teamId, roleId) => `${week}|${slot}|${teamId}|${roleId}`;

function emptyState() {
  return { teams: DEFAULT_TEAMS, assignments: {}, compatiblePairs: [], weekLabels: {} };
}

function isCompatible(teamAId, teamBId, teams, compatiblePairs) {
  if (teamAId === teamBId) return true;
  const a = teams.find((t) => t.id === teamAId);
  const b = teams.find((t) => t.id === teamBId);
  if ((a && a.flexible) || (b && b.flexible)) return true;
  return compatiblePairs.includes(pairKey(teamAId, teamBId));
}

function findIssues(state, week, slot, teamId, roleId, name) {
  const target = normKey(name);
  if (!target) return [];
  const issues = [];
  const selfKey = assignKey(week, slot, teamId, roleId);
  for (const [key, val] of Object.entries(state.assignments)) {
    if (key === selfKey) continue;
    if (normKey(val) !== target) continue;
    const [w, s, tId, rId] = key.split("|");
    if (Number(w) !== week || s !== slot) continue;
    const otherTeam = state.teams.find((t) => t.id === tId);
    const otherRole = otherTeam && otherTeam.roles.find((r) => r.id === rId);
    if (!otherTeam || !otherRole) continue;
    if (tId === teamId) {
      issues.push({ type: "duplicate", team: otherTeam, role: otherRole });
    } else if (!isCompatible(teamId, tId, state.teams, state.compatiblePairs)) {
      issues.push({ type: "conflict", team: otherTeam, role: otherRole });
    }
  }
  return issues;
}

function SetupScreen() {
  return (
    <div style={styles.setupScreen}>
      <div style={styles.setupCard}>
        <h1 style={{ ...styles.h1, marginBottom: 10 }}>One setup step left</h1>
        <p style={styles.setupText}>
          This app is built to sync live across everyone using it, but it
          needs a free Firebase database to do that. Open{" "}
          <code style={styles.code}>index.html</code> in a text editor, find
          the <code style={styles.code}>firebaseConfig</code> block near the
          top of the script, and paste in your project's config.
        </p>
        <p style={styles.setupText}>
          Full step-by-step instructions are in <code style={styles.code}>README.txt</code>.
        </p>
      </div>
    </div>
  );
}

function App() {
  const [state, setState] = useState(null);
  const [week, setWeek] = useState(1);
  const [slot, setSlot] = useState(SLOTS[0]);
  const [activeTeamId, setActiveTeamId] = useState(DEFAULT_TEAMS[0].id);
  const [tab, setTab] = useState("assign");
  const saveTimer = useRef(null);
  const seededRef = useRef(false);

  useEffect(() => {
    if (!FIREBASE_CONFIGURED) return;
    const listener = stateRef.on("value", (snapshot) => {
      const val = snapshot.val();
      if (val) {
        setState({ ...emptyState(), ...val });
      } else if (!seededRef.current) {
        seededRef.current = true;
        const def = emptyState();
        stateRef.set(def);
        setState(def);
      }
    });
    return () => stateRef.off("value", listener);
  }, []);

  const updateState = useCallback((updater) => {
    setState((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => {
        if (stateRef) stateRef.set(next);
      }, 300);
      return next;
    });
  }, []);

  if (!FIREBASE_CONFIGURED) return <SetupScreen />;
  if (!state) {
    return (
      <div style={styles.setupScreen}>
        <div style={styles.setupText}>Connecting…</div>
      </div>
    );
  }

  const activeTeam = state.teams.find((t) => t.id === activeTeamId) || state.teams[0];

  return (
    <div style={styles.app}>
      <Sidebar state={state} week={week} setWeek={setWeek} slot={slot} setSlot={setSlot}
        tab={tab} setTab={setTab} activeTeamId={activeTeam && activeTeam.id}
        setActiveTeamId={setActiveTeamId} />
      <main style={styles.main}>
        {tab === "assign" && <AssignView state={state} updateState={updateState} week={week} slot={slot} team={activeTeam} />}
        {tab === "master" && <MasterListView state={state} week={week} slot={slot} />}
        {tab === "manage" && <ManageView state={state} updateState={updateState} />}
      </main>
    </div>
  );
}

function Sidebar({ state, week, setWeek, slot, setSlot, tab, setTab, activeTeamId, setActiveTeamId }) {
  return (
    <aside style={styles.sidebar}>
      <div>
        <div style={styles.brand}>
          <div style={styles.brandMark}>M</div>
          <div>
            <div style={styles.brandTitle}>Ministry Scheduler</div>
            <div style={styles.brandSub}>Synced live with everyone</div>
          </div>
        </div>

        <div style={styles.sectionLabel}>Service</div>
        <div style={styles.weekRow}>
          {WEEKS.map((w) => (
            <button key={w} onClick={() => setWeek(w)}
              style={{ ...styles.weekBtn, ...(w === week ? styles.weekBtnActive : {}) }}>
              {w}
            </button>
          ))}
        </div>
        {state.weekLabels[week] ? <div style={styles.weekDateLabel}>{state.weekLabels[week]}</div> : null}

        <div style={styles.slotRow}>
          {SLOTS.map((s) => (
            <button key={s} onClick={() => setSlot(s)}
              style={{ ...styles.slotBtn, ...(s === slot ? styles.slotBtnActive : {}) }}>
              {s}
            </button>
          ))}
        </div>

        <div style={styles.sectionLabel}>View</div>
        <nav style={styles.navList}>
          <NavItem label="Assign volunteers" active={tab === "assign"} onClick={() => setTab("assign")} />
          <NavItem label="Master list" active={tab === "master"} onClick={() => setTab("master")} />
          <NavItem label="Manage teams" active={tab === "manage"} onClick={() => setTab("manage")} />
        </nav>

        {tab === "assign" && (
          <React.Fragment>
            <div style={styles.sectionLabel}>Team</div>
            <nav style={styles.navList}>
              {state.teams.map((t) => (
                <NavItem key={t.id} label={t.name} active={t.id === activeTeamId}
                  onClick={() => setActiveTeamId(t.id)} dim={t.flexible} />
              ))}
            </nav>
          </React.Fragment>
        )}
      </div>
      <div style={styles.sidebarFoot}>
        Everyone who opens this app sees the same live schedule. Install
        it to your home screen so it's always one tap away.
      </div>
    </aside>
  );
}

function NavItem({ label, active, onClick, dim }) {
  return (
    <button onClick={onClick}
      style={{ ...styles.navItem, ...(active ? styles.navItemActive : {}), ...(dim && !active ? { opacity: 0.7 } : {}) }}>
      {label}
    </button>
  );
}

function AssignView({ state, updateState, week, slot, team }) {
  if (!team) return null;
  const setName = (roleId, value) => {
    updateState((prev) => {
      const key = assignKey(week, slot, team.id, roleId);
      const nextAssignments = { ...prev.assignments };
      if (norm(value)) nextAssignments[key] = value;
      else delete nextAssignments[key];
      return { ...prev, assignments: nextAssignments };
    });
  };
  return (
    <div style={styles.viewWrap}>
      <header style={styles.viewHeader}>
        <h1 style={styles.h1}>{team.name}</h1>
        <div style={styles.viewMeta}>
          Week {week} · {slot}
          {team.flexible && <span style={styles.flexTag}>compatible with every team</span>}
        </div>
      </header>
      <div style={styles.rolesCard}>
        {team.roles.length === 0 && <div style={styles.emptyNote}>This team has no roles yet. Add some under Manage teams.</div>}
        {team.roles.map((role, i) => {
          const key = assignKey(week, slot, team.id, role.id);
          const value = state.assignments[key] || "";
          const issues = findIssues(state, week, slot, team.id, role.id, value);
          const hasConflict = issues.some((x) => x.type === "conflict");
          const hasDup = issues.some((x) => x.type === "duplicate");
          return (
            <div key={role.id} style={{ ...styles.roleRow, borderTop: i === 0 ? "none" : "1px solid #E4DCC6" }}>
              <div style={styles.roleName}>{role.name}</div>
              <div style={styles.roleInputWrap}>
                <input value={value} onChange={(e) => setName(role.id, e.target.value)}
                  placeholder="Volunteer name"
                  style={{ ...styles.input, ...(hasConflict ? styles.inputConflict : hasDup ? styles.inputDup : {}) }} />
                {issues.length > 0 && (
                  <div style={{ ...styles.issueNote, color: hasConflict ? "#8C2F22" : "#8A6A1A" }}>
                    {issues.map((iss, idx) => (
                      <div key={idx}>
                        {iss.type === "conflict" ? `Also booked for ${iss.team.name} — ${iss.role.name}` : `Also serving as ${iss.role.name} on this team`}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function MasterListView({ state, week, slot }) {
  const rows = [];
  state.teams.forEach((team) => {
    team.roles.forEach((role) => {
      const key = assignKey(week, slot, team.id, role.id);
      const name = state.assignments[key] || "";
      const issues = name ? findIssues(state, week, slot, team.id, role.id, name) : [];
      rows.push({ team, role, name, issues });
    });
  });
  const filled = rows.filter((r) => r.name).length;
  return (
    <div style={styles.viewWrap}>
      <header style={styles.viewHeader}>
        <h1 style={styles.h1}>Master List</h1>
        <div style={styles.viewMeta}>Week {week} · {slot} · {filled} of {rows.length} roles filled</div>
      </header>
      <div style={styles.masterCard}>
        <table style={styles.table}>
          <thead>
            <tr>
              <th style={styles.th}>Team</th>
              <th style={styles.th}>Role</th>
              <th style={styles.th}>Volunteer</th>
              <th style={styles.th}>Status</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, idx) => {
              const hasConflict = r.issues.some((x) => x.type === "conflict");
              const hasDup = r.issues.some((x) => x.type === "duplicate");
              return (
                <tr key={idx} style={{ background: hasConflict ? "#FBE9E5" : hasDup ? "#FBF3DC" : idx % 2 === 0 ? "#FFFFFF" : "#FAF6EA" }}>
                  <td style={styles.td}>{r.team.name}</td>
                  <td style={styles.td}>{r.role.name}</td>
                  <td style={{ ...styles.td, fontWeight: r.name ? 600 : 400 }}>{r.name || <span style={styles.tdMuted}>— open —</span>}</td>
                  <td style={styles.td}>
                    {hasConflict ? <span style={styles.badgeConflict}>Double-booked</span>
                      : hasDup ? <span style={styles.badgeDup}>Also on this team</span>
                      : r.name ? <span style={styles.badgeOk}>Confirmed</span>
                      : <span style={styles.tdMuted}>—</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ManageView({ state, updateState }) {
  const [newTeamName, setNewTeamName] = useState("");
  const [newRoleName, setNewRoleName] = useState({});

  const addTeam = () => {
    const name = norm(newTeamName);
    if (!name) return;
    updateState((prev) => ({ ...prev, teams: [...prev.teams, { id: uid(), name, flexible: false, roles: [] }] }));
    setNewTeamName("");
  };
  const removeTeam = (teamId) => {
    updateState((prev) => ({
      ...prev,
      teams: prev.teams.filter((t) => t.id !== teamId),
      compatiblePairs: prev.compatiblePairs.filter((p) => !p.split("~").includes(teamId)),
      assignments: Object.fromEntries(Object.entries(prev.assignments).filter(([key]) => key.split("|")[2] !== teamId)),
    }));
  };
  const renameTeam = (teamId, name) => {
    updateState((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, name } : t)) }));
  };
  const toggleFlexible = (teamId) => {
    updateState((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, flexible: !t.flexible } : t)) }));
  };
  const addRole = (teamId) => {
    const name = norm(newRoleName[teamId]);
    if (!name) return;
    updateState((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, roles: [...t.roles, { id: uid(), name }] } : t)) }));
    setNewRoleName((prev) => ({ ...prev, [teamId]: "" }));
  };
  const removeRole = (teamId, roleId) => {
    updateState((prev) => ({
      ...prev,
      teams: prev.teams.map((t) => (t.id === teamId ? { ...t, roles: t.roles.filter((r) => r.id !== roleId) } : t)),
      assignments: Object.fromEntries(Object.entries(prev.assignments).filter(([key]) => {
        const parts = key.split("|");
        return !(parts[2] === teamId && parts[3] === roleId);
      })),
    }));
  };
  const renameRole = (teamId, roleId, name) => {
    updateState((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, roles: t.roles.map((r) => (r.id === roleId ? { ...r, name } : r)) } : t)) }));
  };
  const togglePair = (aId, bId) => {
    const key = pairKey(aId, bId);
    updateState((prev) => ({ ...prev, compatiblePairs: prev.compatiblePairs.includes(key) ? prev.compatiblePairs.filter((p) => p !== key) : [...prev.compatiblePairs, key] }));
  };
  const setWeekLabel = (week, label) => {
    updateState((prev) => ({ ...prev, weekLabels: { ...prev.weekLabels, [week]: label } }));
  };

  const rigidTeams = state.teams.filter((t) => !t.flexible);

  return (
    <div style={styles.viewWrap}>
      <header style={styles.viewHeader}>
        <h1 style={styles.h1}>Manage Teams</h1>
        <div style={styles.viewMeta}>Edit teams and roles, and decide which teams may share a volunteer at the same service.</div>
      </header>
      <div style={styles.manageGrid}>
        {state.teams.map((team) => (
          <div key={team.id} style={styles.teamCard}>
            <div style={styles.teamCardHead}>
              <input value={team.name} onChange={(e) => renameTeam(team.id, e.target.value)} style={styles.teamNameInput} />
              <button onClick={() => removeTeam(team.id)} style={styles.linkDanger}>Remove team</button>
            </div>
            <label style={styles.flexToggle}>
              <input type="checkbox" checked={!!team.flexible} onChange={() => toggleFlexible(team.id)} />
              Compatible with every other team (like a prayer team)
            </label>
            <div style={styles.roleList}>
              {team.roles.map((role) => (
                <div key={role.id} style={styles.roleEditRow}>
                  <input value={role.name} onChange={(e) => renameRole(team.id, role.id, e.target.value)} style={styles.roleEditInput} />
                  <button onClick={() => removeRole(team.id, role.id)} style={styles.iconDanger} aria-label="Remove role">×</button>
                </div>
              ))}
              <div style={styles.addRoleRow}>
                <input value={newRoleName[team.id] || ""} onChange={(e) => setNewRoleName((prev) => ({ ...prev, [team.id]: e.target.value }))}
                  placeholder="New role name" style={styles.roleEditInput}
                  onKeyDown={(e) => { if (e.key === "Enter") addRole(team.id); }} />
                <button onClick={() => addRole(team.id)} style={styles.smallBtn}>Add</button>
              </div>
            </div>
          </div>
        ))}
        <div style={styles.newTeamCard}>
          <div style={styles.newTeamLabel}>Add a new team</div>
          <input value={newTeamName} onChange={(e) => setNewTeamName(e.target.value)} placeholder="e.g. Hospitality" style={styles.roleEditInput}
            onKeyDown={(e) => { if (e.key === "Enter") addTeam(); }} />
          <button onClick={addTeam} style={styles.smallBtn}>Add team</button>
        </div>
      </div>

      {rigidTeams.length > 1 && (
        <div style={{ marginTop: 28 }}>
          <div style={styles.sectionLabel}>Allowed double-bookings</div>
          <div style={styles.pairNote}>Check a pair if the same person is allowed to serve on both teams at the same service without being flagged.</div>
          <div style={styles.pairGrid}>
            {rigidTeams.map((a, i) => rigidTeams.slice(i + 1).map((b) => (
              <label key={a.id + b.id} style={styles.pairItem}>
                <input type="checkbox" checked={state.compatiblePairs.includes(pairKey(a.id, b.id))} onChange={() => togglePair(a.id, b.id)} />
                {a.name} + {b.name}
              </label>
            )))}
          </div>
        </div>
      )}

      <div style={{ marginTop: 28 }}>
        <div style={styles.sectionLabel}>Week dates</div>
        <div style={styles.weekLabelGrid}>
          {WEEKS.map((w) => (
            <label key={w} style={styles.weekLabelItem}>
              <span>Week {w}</span>
              <input value={state.weekLabels[w] || ""} onChange={(e) => setWeekLabel(w, e.target.value)} placeholder="e.g. July 6, 2026" style={styles.weekLabelInput} />
            </label>
          ))}
        </div>
      </div>
    </div>
  );
}

const styles = {
  app: { display: "flex", minHeight: "100vh", background: "#F6F1E4", color: "#2A2620", fontFamily: '"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif' },
  setupScreen: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#F6F1E4", padding: 24 },
  setupCard: { maxWidth: 520, background: "#FFFFFF", border: "1px solid #E4DCC6", borderRadius: 12, padding: 32 },
  setupText: { fontFamily: "system-ui, sans-serif", fontSize: 14.5, lineHeight: 1.7, color: "#4A4230" },
  code: { background: "#EFE7D3", padding: "1px 6px", borderRadius: 4, fontSize: 13 },
  sidebar: { width: 260, flexShrink: 0, background: "#23211D", color: "#EFE7D3", display: "flex", flexDirection: "column", justifyContent: "space-between", padding: "24px 18px", boxSizing: "border-box" },
  brand: { display: "flex", alignItems: "center", gap: 10, marginBottom: 26 },
  brandMark: { width: 34, height: 34, borderRadius: 6, background: "#A9782F", color: "#23211D", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontFamily: "Georgia, serif", fontSize: 18, flexShrink: 0 },
  brandTitle: { fontFamily: "Georgia, serif", fontSize: 16.5, lineHeight: 1.2 },
  brandSub: { fontSize: 11.5, color: "#B8AD8C", marginTop: 2, fontFamily: "system-ui, sans-serif" },
  sectionLabel: { fontSize: 11, letterSpacing: 0.3, color: "#9B8F6C", margin: "20px 0 8px", fontFamily: "system-ui, sans-serif" },
  weekRow: { display: "flex", gap: 6 },

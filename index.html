function formatRelativeTime(ts) {

  const mins = Math.floor(diffMs / 60000);

  if (m) {

    if (/pm/i.test(m[3])) h += 12;
    return h * 60 + min;

    const role = team && team.roles.find((r) => r.id === roleId);
    if (team && role) {
      const key = assignKey(week, slot, teamId, roleId);
      const name = monthState.assignments[key] || "";
      const issues = name ? findIssues(config, monthState, week, slot, teamId, roleId, name) : [];
      return { value: name, editable: false, issues };
    }
  }
  if (norm(row.fixedText)) return { value: row.fixedText, editable: false, issues: [] };
  const cvKey = `${week}|${slot}|${row.id}`;
  const value = (monthState.customValues && monthState.customValues[cvKey]) || "";
  return { value, editable: true, issues: [] };
}

// Resolve the live value behind a role tag (e.g. "music::song-leader"),
// used for the extra lines that can be shown under a Program-column label
// (e.g. song titles listed under "PRAISE AND WORSHIP").
function resolveRoleTagValue(config, monthState, week, slot, tag) {
  const [teamId, roleId] = (tag || "").split("::");
  const team = config.teams.find((t) => t.id === teamId);
  const role = team && team.roles.find((r) => r.id === roleId);
  if (!team || !role) return "";
  const key = assignKey(week, slot, teamId, roleId);
  return monthState.assignments[key] || "";
}

// Resolve the verse text entered (in Assign volunteers) for a print-program
// row's linked role, but only when that role has been marked "Add a verse
// box next to this role" (role.hasVerse) in Manage Teams. Used so the print
// run sheet can show the verse as its own row under the linked task.
function resolveRowVerse(config, monthState, week, slot, row) {
  if (!row.linkedRole) return "";
  const [teamId, roleId] = row.linkedRole.split("::");
  const team = config.teams.find((t) => t.id === teamId);
  const role = team && team.roles.find((r) => r.id === roleId);
  if (!team || !role || !role.hasVerse) return "";
  const key = assignKey(week, slot, teamId, roleId);
  return (monthState.verses && monthState.verses[key]) || "";
}

function isCompatible(teamAId, teamBId, teams, compatiblePairs) {
  if (teamAId === teamBId) return true;
  const a = teams.find((t) => t.id === teamAId);
  const b = teams.find((t) => t.id === teamBId);
  if ((a && a.flexible) || (b && b.flexible)) return true;
  return compatiblePairs.includes(pairKey(teamAId, teamBId));
}

function findIssues(config, monthState, week, slot, teamId, roleId, name) {
  const target = normKey(name);
  if (!target) return [];
  const issues = [];
  const selfKey = assignKey(week, slot, teamId, roleId);
  const selfTag = roleTag(teamId, roleId);
  for (const [key, val] of Object.entries(monthState.assignments)) {
    if (key === selfKey) continue;
    if (normKey(val) !== target) continue;
    const [w, s, tId, rId] = key.split("|");
    if (Number(w) !== week || s !== slot) continue;
    const otherTeam = config.teams.find((t) => t.id === tId);
    const otherRole = otherTeam && otherTeam.roles.find((r) => r.id === rId);
    if (!otherTeam || !otherRole) continue;

    const otherTag = roleTag(tId, rId);
    const explicitlyAllowed = (config.compatibleGroups || []).some((g) => g.includes(selfTag) && g.includes(otherTag));
    if (explicitlyAllowed) continue;

    if (tId === teamId) {
      issues.push({ type: "duplicate", team: otherTeam, role: otherRole });
    } else if (!isCompatible(teamId, tId, config.teams, config.compatiblePairs)) {
      issues.push({ type: "conflict", team: otherTeam, role: otherRole });
    }
  }
  return issues;
}

// Real login, backed by Firebase Authentication (email + password) instead
// of a self-reported name. "Sign in" is for people who already created an
// account; "Create account" lets a first-time volunteer set one up
// themselves without needing Firebase console access. The name they enter
// at signup becomes their Firebase displayName, and that's what the rest
// of the app (presence, the Editors list in Manage Teams, etc.) uses as
// their "userName" — so an existing editor should sign up using the exact
// same name their team leader already added to the Editors list, to keep
// their edit access.
function AuthGate({ auth, onSignedIn, onBack }) {
  const [mode, setMode] = useState("signin"); // "signin" | "signup" | "reset"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [busy, setBusy] = useState(false);

  const friendlyError = (err) => {
    const code = err && err.code;
    if (code === "auth/invalid-email") return "That email doesn't look right.";
    if (code === "auth/missing-email") return "Enter your email.";
    if (code === "auth/user-not-found") return "No account with that email yet — try Create account.";
    if (code === "auth/wrong-password" || code === "auth/invalid-credential" || code === "auth/invalid-login-credentials") return "Wrong email or password.";
    if (code === "auth/email-already-in-use") return "That email already has an account — try Sign in instead.";
    if (code === "auth/weak-password") return "Password should be at least 6 characters.";
    if (code === "auth/too-many-requests") return "Too many attempts — please wait a bit and try again.";
    if (code === "auth/network-request-failed") return "Network error — check your connection and try again.";
    return (err && err.message) || "Something went wrong.";
  };

  const submit = async () => {
    setError("");
    setNotice("");
    const cleanEmail = norm(email);
    if (mode === "reset") {
      if (!cleanEmail) { setError("Enter your email first."); return; }
      setBusy(true);
      try {
        await auth.sendPasswordResetEmail(cleanEmail);
        setNotice("Password reset email sent — check your inbox.");
      } catch (err) {
        setError(friendlyError(err));
      } finally {
        setBusy(false);
      }
      return;
    }
    if (!cleanEmail || !password) { setError("Enter your email and password."); return; }
    if (mode === "signup" && !norm(displayName)) { setError("Enter your name too."); return; }
    setBusy(true);
    try {
      if (mode === "signup") {
        const cred = await auth.createUserWithEmailAndPassword(cleanEmail, password);
        await cred.user.updateProfile({ displayName: norm(displayName) });
        onSignedIn(auth.currentUser);
      } else {
        const cred = await auth.signInWithEmailAndPassword(cleanEmail, password);
        onSignedIn(cred.user);
      }
    } catch (err) {
      setError(friendlyError(err));
    } finally {
      setBusy(false);
    }
  };

  const switchMode = (next) => {
    setMode(next);
    setError("");
    setNotice("");
  };

  return (
    <div style={styles.setupScreen}>
      <div style={styles.setupCard}>
        {onBack && (
          <button onClick={onBack} style={styles.backLink}>← Back</button>
        )}
        <h1 style={{ ...styles.h1, marginBottom: 10 }}>
          {mode === "signup" ? "Create your account" : mode === "reset" ? "Reset your password" : "Sign in"}
        </h1>
        <p style={styles.setupText}>
          {mode === "signup"
            ? "Set up your login for the scheduler. Use the exact same name your team leader already added to the Editors list, so your edit access carries over."
            : mode === "reset"
            ? "Enter the email on your account and we'll send you a reset link."
            : "Sign in to view and edit the schedule."}
        </p>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
          {mode === "signup" && (
            <input value={displayName} onChange={(e) => setDisplayName(e.target.value)}
              placeholder="Your name (e.g. Juan Dela Cruz)" style={styles.input} autoFocus />
          )}
          <input value={email} onChange={(e) => setEmail(e.target.value)} type="email"
            placeholder="Email" style={styles.input} autoFocus={mode !== "signup"}
            onKeyDown={(e) => { if (e.key === "Enter") submit(); }} />
          {mode !== "reset" && (
            <input value={password} onChange={(e) => setPassword(e.target.value)} type="password"
              placeholder="Password" style={styles.input}
              onKeyDown={(e) => { if (e.key === "Enter") submit(); }} />
          )}
          {error && <div style={{ color: "#A6402F", fontSize: 13, fontFamily: "system-ui, sans-serif" }}>{error}</div>}
          {notice && <div style={{ color: "#3B6B3E", fontSize: 13, fontFamily: "system-ui, sans-serif" }}>{notice}</div>}
          <button onClick={submit} disabled={busy} style={{ ...styles.smallBtn, padding: "10px 14px", opacity: busy ? 0.6 : 1 }}>
            {busy ? "Please wait…" : mode === "signup" ? "Create account" : mode === "reset" ? "Send reset email" : "Sign in"}
          </button>
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            {mode !== "signup" && (
              <button onClick={() => switchMode("signup")}
                style={{ background: "none", border: "none", color: "#7A6E4E", fontSize: 12.5, cursor: "pointer", fontFamily: "system-ui, sans-serif", padding: 0, textAlign: "left" }}>
                New here? Create an account
              </button>
            )}
            {mode !== "signin" && (
              <button onClick={() => switchMode("signin")}
                style={{ background: "none", border: "none", color: "#7A6E4E", fontSize: 12.5, cursor: "pointer", fontFamily: "system-ui, sans-serif", padding: 0, textAlign: "left" }}>
                Already have an account? Sign in
              </button>
            )}
            {mode !== "reset" && (
              <button onClick={() => switchMode("reset")}
                style={{ background: "none", border: "none", color: "#7A6E4E", fontSize: 12.5, cursor: "pointer", fontFamily: "system-ui, sans-serif", padding: 0, textAlign: "left" }}>
                Forgot password?
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);
  const [config, setConfig] = useState(null);
  const [monthState, setMonthState] = useState(null);
  const [week, setWeek] = useState(1);
  const [slot, setSlot] = useState(SLOTS[0]);
  const [activeTeamId, setActiveTeamId] = useState(DEFAULT_TEAMS[0].id);
  const [tab, setTab] = useState("assign");
  const [authUser, setAuthUser] = useState(undefined); // undefined = checking, null = signed out
  const [entryScreen, setEntryScreen] = useState("choice"); // "choice" | "login" | "quickview" — only used while signed out
  const userName = authUser ? norm(authUser.displayName || (authUser.email || "").split("@")[0]) : "";
  const [onlineUsers, setOnlineUsers] = useState([]);
  const [isMobile, setIsMobile] = useState(() => (typeof window !== "undefined" ? window.matchMedia("(max-width: 860px)").matches : false));
  const saveTimer = useRef(null);
  const configSaveTimer = useRef(null);
  const migratedRef = useRef(false);

  useEffect(() => {
    if (!auth) { setAuthUser(null); return; }
    const unsub = auth.onAuthStateChanged((u) => { setAuthUser(u); if (!u) setEntryScreen("choice"); });
    return unsub;
  }, []);

  useEffect(() => {
    if (!FIREBASE_CONFIGURED) return;
    const listener = configRef.on("value", (snapshot) => {
      const val = snapshot.val();
      if (val) {
        const safeTeams = (val.teams || DEFAULT_TEAMS).map((t) => ({
          ...t,
          roles: t.roles || [],
        }));
        setConfig({ ...emptyConfig(), ...val, teams: safeTeams, printProgram: val.printProgram || defaultPrintProgram() });
        return;
      }
      if (migratedRef.current) return;
      migratedRef.current = true;
      firebase.database().ref("ministry-scheduler-state").once("value").then((oldSnap) => {
        const old = oldSnap.val();
        if (old && (old.teams || old.assignments)) {
          const conf = { teams: old.teams || DEFAULT_TEAMS, compatiblePairs: old.compatiblePairs || [], compatibleGroups: old.compatibleGroups || [], restrictions: old.restrictions || {} };
          configRef.set(conf);
          setConfig(conf);
          const curKey = periodKey(now.getFullYear(), now.getMonth() + 1);
          firebase.database().ref(`ministry-scheduler-months/${curKey}`).set({
            assignments: old.assignments || {},
            weekLabels: old.weekLabels || {},
          });
        } else {
          const conf = emptyConfig();
          configRef.set(conf);
          setConfig(conf);
        }
      });
    });
    return () => configRef.off("value", listener);
  }, []);

  useEffect(() => {
    if (!FIREBASE_CONFIGURED) return;
    setMonthState(null);
    const ref = monthRef(year, month);
    const listener = ref.on("value", (snapshot) => {
      setMonthState({ ...emptyMonthState(), ...(snapshot.val() || {}) });
    });
    return () => ref.off("value", listener);
  }, [year, month]);

  useEffect(() => {
    if (!FIREBASE_CONFIGURED || !userName || !authUser) return;
    const myPresenceRef = firebase.database().ref(`presence/${authUser.uid}`);
    const connectedRef = firebase.database().ref(".info/connected");
    const onConnected = connectedRef.on("value", (snap) => {
      if (snap.val() === true) {
        myPresenceRef.onDisconnect().remove();
        myPresenceRef.set({ name: userName, since: firebase.database.ServerValue.TIMESTAMP });
      }
    });
    const presenceListRef = firebase.database().ref("presence");
    const onPresence = presenceListRef.on("value", (snapshot) => {
      const val = snapshot.val() || {};
      setOnlineUsers(Object.entries(val).map(([id, v]) => ({ id, ...v })));
    });
    return () => {
      connectedRef.off("value", onConnected);
      presenceListRef.off("value", onPresence);
      myPresenceRef.remove();
    };
  }, [userName, authUser]);

  useEffect(() => {
    const mq = window.matchMedia("(max-width: 860px)");
    const handler = (e) => setIsMobile(e.matches);
    if (mq.addEventListener) mq.addEventListener("change", handler);
    else mq.addListener(handler);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", handler);
      else mq.removeListener(handler);
    };
  }, []);

  const updateConfig = useCallback((updater) => {
    setConfig((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      clearTimeout(configSaveTimer.current);
      configSaveTimer.current = setTimeout(() => {
        if (configRef) configRef.set(next);
      }, 300);
      return next;
    });
  }, []);

  const updateMonthState = useCallback((updater) => {
    setMonthState((prev) => {
      const base = prev || emptyMonthState();
      const next = typeof updater === "function" ? updater(base) : updater;
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => {
        monthRef(year, month).set(next);
      }, 300);
      return next;
    });
  }, [year, month]);

  const shiftMonth = (delta) => {
    let m = month + delta;
    let y = year;
    while (m > 12) { m -= 12; y += 1; }
    while (m < 1) { m += 12; y -= 1; }
    setMonth(m);
    setYear(y);
  };

  // Whether this name has an explicit entry in the restrictions list at all.
  // No entry = this person cannot edit any ministry's assignments, the
  // service details tab, or Manage Teams. Only names on the list with
  // "can manage teams" checked get into Manage Teams — EXCEPT: if literally
  // no one in the whole list has "can manage teams" checked yet, Manage
  // Teams stays open to everyone. Without this, the very first save could
  // lock everyone out with no way back in through the app.
  const hasRestrictionEntry = !!config && Object.prototype.hasOwnProperty.call(config.restrictions || {}, normKey(userName));
  const restrictionsObj = config ? (config.restrictions || {}) : {};
  const noManagerSetYet = !Object.values(restrictionsObj).some((v) => normalizeRestriction(v).canManage);
  const restrictionEntry = config ? normalizeRestriction((config.restrictions || {})[normKey(userName)]) : { teams: [], canManage: false };
  const allowedTeamIds = restrictionEntry.teams;
  const canManage = (hasRestrictionEntry && restrictionEntry.canManage) || noManagerSetYet;
  const canEditServiceInfo = allowedTeamIds.includes(ADMIN_TEAM_ID);

  useEffect(() => {
    if (!hasRestrictionEntry) return;
    if (allowedTeamIds.length && !allowedTeamIds.includes(activeTeamId)) setActiveTeamId(allowedTeamIds[0]);
    if (tab === "manage" && !canManage) setTab("assign");
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [hasRestrictionEntry, canManage, allowedTeamIds.join(","), activeTeamId, tab]);

  if (!FIREBASE_CONFIGURED) return (<React.Fragment><Watermark /><SetupScreen /></React.Fragment>);
  if (authUser === undefined) {
    return (
      <React.Fragment>
        <Watermark />
        <div style={styles.setupScreen}>
          <div style={styles.setupText}>Checking your session…</div>
        </div>
      </React.Fragment>
    );
  }
  if (!authUser) {
    if (entryScreen === "quickview") {
      return (
        <QuickView config={config} monthState={monthState} year={year} month={month}
          onPrevMonth={() => shiftMonth(-1)} onNextMonth={() => shiftMonth(1)}
          onLogin={() => setEntryScreen("login")} />
      );
    }
    if (entryScreen === "login") {
      return (<React.Fragment><Watermark /><AuthGate auth={auth} onSignedIn={setAuthUser} onBack={() => setEntryScreen("choice")} /></React.Fragment>);
    }
    return (<React.Fragment><Watermark /><EntryChoice onQuickView={() => setEntryScreen("quickview")} onLogin={() => setEntryScreen("login")} /></React.Fragment>);
  }
  if (!config || !monthState) {
    return (
      <React.Fragment>
        <Watermark />
        <div style={styles.setupScreen}>
          <div style={styles.setupText}>Connecting…</div>
        </div>
      </React.Fragment>
    );
  }

  const activeTeam = config.teams.find((t) => t.id === activeTeamId) || config.teams[0];
  const effectiveTab = !canManage && tab === "manage" ? "assign" : tab;

  return (
    <React.Fragment>
      <Watermark />
      <div className="app-shell" style={styles.app}>
      <Sidebar config={config} monthState={monthState} week={week} setWeek={setWeek} slot={slot} setSlot={setSlot}

function MobileControls({ monthState, week, setWeek, slot, setSlot, monthLabelText, year, month, onPrevMonth, onNextMonth, onlineUsers, userName }) {
  const others = (onlineUsers || []).filter((u) => norm(u.name).toLowerCase() !== norm(userName).toLowerCase());
  const [showPresence, setShowPresence] = useState(false);
  const [coords, setCoords] = useState(null);
  const presenceWrapRef = useRef(null);
  const pillRef = useRef(null);
  const popupRef = useRef(null);

  // The pill sits inside a row that scrolls horizontally
  // (mobileControlsRow has overflowX set), and setting only one axis of
  // overflow makes browsers force the other axis to "auto" too — which
  // clips anything absolutely positioned outside that row's own box. So
  // the names dropdown is rendered through a portal into document.body and
  // positioned with position:fixed against the pill's own bounding box,
  // the same trick used for the volunteer-name suggestion popup below.
  const updateCoords = useCallback(() => {
    const el = pillRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    setCoords({ top: rect.bottom + 6, right: window.innerWidth - rect.right });
  }, []);

  useEffect(() => {
    if (!showPresence) return;
    updateCoords();
    const handleOutside = (e) => {
      if (presenceWrapRef.current && presenceWrapRef.current.contains(e.target)) return;
      if (popupRef.current && popupRef.current.contains(e.target)) return;
      setShowPresence(false);
    };
    document.addEventListener("mousedown", handleOutside);
    window.addEventListener("scroll", updateCoords, true);
    window.addEventListener("resize", updateCoords);
    return () => {
      document.removeEventListener("mousedown", handleOutside);
      window.removeEventListener("scroll", updateCoords, true);
      window.removeEventListener("resize", updateCoords);
    };
  }, [showPresence, updateCoords]);

  return (
    <div className="no-print" style={styles.mobileControls}>
      <div style={styles.mobileControlsRow}>
        <div style={styles.mobileMonthNav}>
          <button onClick={onPrevMonth} style={styles.monthNavBtn} aria-label="Previous month">‹</button>
          <div style={styles.mobileMonthLabel}>{monthLabelText}</div>
          <button onClick={onNextMonth} style={styles.monthNavBtn} aria-label="Next month">›</button>
        </div>
        <div ref={presenceWrapRef} style={{ position: "relative" }}>
          <button ref={pillRef} onClick={() => setShowPresence((v) => !v)} style={styles.mobilePresencePill}>
            🟢 {1 + others.length} online
          </button>
          {showPresence && coords && ReactDOM.createPortal(
            <div ref={popupRef} className="no-print"
              style={{ ...styles.mobilePresenceDropdown, position: "fixed", top: coords.top, right: coords.right }}>
              <div style={styles.mobilePresenceDropdownItem}><span style={styles.presenceDot} />{userName} (you)</div>
              {others.map((u) => (
                <div key={u.id} style={styles.mobilePresenceDropdownItem}><span style={styles.presenceDot} />{u.name}</div>
              ))}
            </div>,
            document.body
          )}
        </div>
      </div>
      <div style={styles.mobileControlsRow}>
        {WEEKS.map((w) => (
          <button key={w} onClick={() => setWeek(w)}
            style={{ ...styles.mobileWeekBtn, ...(w === week ? styles.weekBtnActive : {}) }}>
            {w}
          </button>
        ))}
        {SLOTS.map((s) => (
          <button key={s} onClick={() => setSlot(s)}
            style={{ ...styles.mobileSlotBtn, ...(s === slot ? styles.slotBtnActive : {}) }}>
            {s}
          </button>
        ))}
      </div>
      <div style={styles.mobileWeekDate}>{weekDisplayLabel(week, monthState.weekLabels, year, month)}</div>
    </div>
  );
}

function initials(name) {
  const parts = norm(name).split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function AssignView({ config, updateConfig, monthState, updateMonthState, week, slot, team, year, month, locked, isMobile, userName }) {
  const [confirmOpen, setConfirmOpen] = useState(false);
  if (!team) return null;
  const setName = (roleId, value) => {
    if (locked) return;
    updateMonthState((prev) => {
      const key = assignKey(week, slot, team.id, roleId);
      const nextAssignments = { ...prev.assignments };
      if (norm(value)) nextAssignments[key] = value;
      else delete nextAssignments[key];
      const nextEditMeta = withEditMeta({ ...(prev.editMeta || {}) }, key, userName);
      return { ...prev, assignments: nextAssignments, editMeta: nextEditMeta };
    });
  };
  const setVerse = (roleId, value) => {
    if (locked) return;
    updateMonthState((prev) => {
      const key = assignKey(week, slot, team.id, roleId);
      const nextVerses = { ...(prev.verses || {}) };
      if (norm(value)) nextVerses[key] = value;
      else delete nextVerses[key];
      const nextEditMeta = withEditMeta({ ...(prev.editMeta || {}) }, key + "__verse", userName);
      return { ...prev, verses: nextVerses, editMeta: nextEditMeta };
    });
  };
  const hasAnyValue = team.roles.some((role) => {
    const key = assignKey(week, slot, team.id, role.id);
    return norm(monthState.assignments[key]) || norm((monthState.verses || {})[key]);
  });
  const confirmClearAll = () => {
    setConfirmOpen(false);
    updateMonthState((prev) => {
      const nextAssignments = { ...prev.assignments };
      const nextVerses = { ...(prev.verses || {}) };
      let nextEditMeta = { ...(prev.editMeta || {}) };
      team.roles.forEach((role) => {
        const key = assignKey(week, slot, team.id, role.id);
        delete nextAssignments[key];
        delete nextVerses[key];
        nextEditMeta = withEditMeta(nextEditMeta, key, userName);
        nextEditMeta = withEditMeta(nextEditMeta, key + "__verse", userName);
      });
      return { ...prev, assignments: nextAssignments, verses: nextVerses, editMeta: nextEditMeta };
    });
  };
  return (
    <div style={styles.viewWrap}>
      <header style={styles.viewHeader}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
          <h1 style={styles.h1}>{team.name}</h1>
          {!locked && (
            <button onClick={() => hasAnyValue && setConfirmOpen(true)} disabled={!hasAnyValue}
              style={{ ...styles.smallBtn, background: "#A6402F", opacity: hasAnyValue ? 1 : 0.45, cursor: hasAnyValue ? "pointer" : "default" }}>
              Clear all
            </button>
          )}
        </div>
        <div style={styles.viewMeta}>
          {weekDisplayLabel(week, monthState.weekLabels, year, month)} · {slot}
          {team.flexible && <span style={styles.flexTag}>compatible with every team</span>}
          {locked && <span style={styles.flexTag}>view only — you can only edit your ministry</span>}
        </div>
      </header>
      <div style={styles.rolesCard}>
        {team.roles.length === 0 && <div style={styles.emptyNote}>This team has no roles yet. Add some under Manage teams.</div>}
        {team.roles.map((role, i) => {
          const key = assignKey(week, slot, team.id, role.id);
          const value = monthState.assignments[key] || "";
          const verseValue = (monthState.verses && monthState.verses[key]) || "";
          const issues = findIssues(config, monthState, week, slot, team.id, role.id, value);
          const hasConflict = issues.some((x) => x.type === "conflict");
          const hasDup = issues.some((x) => x.type === "duplicate");
          const roleVolunteers = (role.volunteers || []).slice().sort((a, b) => a.localeCompare(b));
          const meta = (monthState.editMeta && monthState.editMeta[key]) || null;
          const verseMeta = (monthState.editMeta && monthState.editMeta[key + "__verse"]) || null;
          return (         
            <div key={role.id} style={{ ...styles.roleRow, ...(i % 2 === 1 ? styles.roleRowAlt : {}), borderTop: i === 0 ? "none" : "1px solid #EFE7D3", ...(isMobile ? { flexDirection: "column", gap: 8 } : {}) }}>
              <div style={{ ...styles.roleName, ...(isMobile ? { width: "100%", paddingTop: 0 } : {}) }}><span style={styles.roleNameDot} />{role.name}</div>
                <div style={{ ...styles.roleInputWrap, ...(isMobile ? { width: "100%" } : {}) }}>
                <div style={{ display: "flex", gap: 10, ...(isMobile ? { flexDirection: "column" } : {}) }}>
                  <VolunteerNameInput
                    value={value}
                    onChange={(val) => setName(role.id, val)}
                    volunteers={roleVolunteers}
                    locked={locked}
                    placeholder="Volunteer name"
                    meta={meta}
                    style={{ ...styles.input, flex: 1, ...(hasConflict ? styles.inputConflict : hasDup ? styles.inputDup : {}), ...(locked ? { background: "#F3EFE2", cursor: "default" } : {}) }}
                  />
                  {role.hasVerse && (
                    <TextFieldWithMeta
                      value={verseValue}
                      onChange={(val) => setVerse(role.id, val)}
                      placeholder="Verse (e.g. James 2:14-17)"
                      locked={locked}
                      meta={verseMeta}
                      wrapStyle={{ flex: 1 }}
                      style={{ ...styles.input, width: "100%", boxSizing: "border-box", ...(locked ? { background: "#F3EFE2", cursor: "default" } : {}) }}
                    />
                  )}
                </div>
                {issues.length > 0 && (
                  <div style={{ ...styles.issueNote, color: hasConflict ? "#8C2F22" : "#8A6A1A" }}>
                    {issues.map((iss, idx) => (
                      <div key={idx}>
                        {iss.type === "conflict" ? `Also booked for ${iss.team.name} — ${iss.role.name}` : `Also serving as ${iss.role.name} on this team`}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
      {confirmOpen && (
        <ClearNamesModal teamName={team.name} onCancel={() => setConfirmOpen(false)} onConfirm={confirmClearAll} />
      )}
    </div>
  );
}

// A branded confirmation dialog for destructive "Clear all" actions,
// rendered through a portal so it sits above everything (sidebar, sticky
// headers, etc.) regardless of where in the tree it's triggered from.
function ClearNamesModal({ teamName, onCancel, onConfirm }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onCancel(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onCancel]);

  return ReactDOM.createPortal(
    <div className="no-print" style={styles.modalOverlay} onMouseDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div style={styles.modalCard}>
        <div style={styles.modalIconRow}>
          <div style={styles.modalIconBadge}>!</div>
          <div style={styles.modalTitle}>Clear Names</div>
        </div>
        <div style={styles.modalBody}>
          This will remove all volunteer names and verses from this ministry
          tab for this service, and update the Master List.
        </div>
        <div style={styles.modalHighlight}>
          <div style={styles.modalHighlightTeam}>{teamName}</div>
          <div style={styles.modalHighlightNote}>Only this tab will be affected. Other ministry tabs stay untouched.</div>
        </div>
        <div style={styles.modalWarning}>
          This cannot be undone. Please make sure you're on the right tab before continuing.
        </div>
        <div style={styles.modalActions}>
          <button onClick={onCancel} style={styles.modalCancelBtn}>Cancel</button>
          <button onClick={onConfirm} style={styles.modalConfirmBtn}>Yes, Clear Names</button>
        </div>
      </div>
    </div>,
    document.body
  );
}

// A volunteer-name text input with a custom popup dropdown of saved names for
// this role. The dropdown is rendered through a portal into document.body
// and positioned with position:fixed against the input's own bounding box,
// so it floats above everything (never gets clipped by a scrolling/overflow
// ancestor like the roles card) and always has room to fully show itself.
// Opening it via click/focus always shows the FULL saved list for the role
// (not narrowed to whatever text is already in the box) so a name that's
// already been chosen — including one currently flagged as a conflict or
// duplicate — can still be swapped for someone else with one click. Typing
// further narrows the list as usual. Selecting a suggestion, or typing a
// brand new name, only fills the field — it never writes back to the saved
// Press-and-hold "last changed by" info badge. Sits absolutely inside a
// position:relative wrapper around a field, at the field's right edge.
// Anchor its coordinates off `anchorRef` (the field itself) so the tooltip
// is portaled to <body> with fixed positioning — this keeps it from being
// clipped by any ancestor's overflow (e.g. the scrollable roles card).
function LastChangedBadge({ meta, anchorRef, align }) {
  const [show, setShow] = useState(false);
  const [coords, setCoords] = useState(null);
  const metaTime = metaTimeText(meta);
  const hasMeta = hasMetaInfo(meta);

  const updateCoords = useCallback(() => {
    const el = anchorRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    setCoords({ top: rect.bottom + 6, right: window.innerWidth - rect.right });
  }, [anchorRef]);

  useEffect(() => {
    if (!show) return;
    updateCoords();
    window.addEventListener("scroll", updateCoords, true);
    window.addEventListener("resize", updateCoords);
    return () => {
      window.removeEventListener("scroll", updateCoords, true);
      window.removeEventListener("resize", updateCoords);
    };
  }, [show, updateCoords]);

  if (!hasMeta) return null;

  return (
    <React.Fragment>
      <button
        type="button"
        aria-label="Last changed by"
        onMouseDown={(e) => { e.preventDefault(); updateCoords(); setShow(true); }}
        onMouseUp={() => setShow(false)}
        onMouseLeave={() => setShow(false)}
        onTouchStart={(e) => { e.preventDefault(); updateCoords(); setShow(true); }}
        onTouchEnd={() => setShow(false)}
        onTouchCancel={() => setShow(false)}
        onContextMenu={(e) => e.preventDefault()}
        style={{
          position: "absolute", right: 8,
          ...(align === "top" ? { top: 10 } : { top: "50%", transform: "translateY(-50%)" }),
          width: 22, height: 22, borderRadius: "50%", border: "none", padding: 0,
          display: "flex", alignItems: "center", justifyContent: "center",
          background: show ? "#D8CFB0" : "transparent",
          cursor: "pointer", overflow: "hidden",
          userSelect: "none", WebkitUserSelect: "none", touchAction: "manipulation",
          transition: "background 0.15s ease",
        }}
      >
        <span style={{
          position: "absolute", fontSize: 13, fontWeight: 700, fontFamily: "Georgia, serif",
          color: "#A99B72", lineHeight: 1,
          opacity: show ? 0 : 1, transform: show ? "scale(0.4) rotate(-20deg)" : "scale(1) rotate(0deg)",
          transition: "opacity 0.18s ease, transform 0.18s ease",
        }}>i</span>
        <img src="./icons/victory.png" alt="" style={{
          position: "absolute", width: "100%", height: "100%", objectFit: "cover", borderRadius: "50%",
          opacity: show ? 1 : 0, transform: show ? "scale(1) rotate(0deg)" : "scale(0.4) rotate(20deg)",
          transition: "opacity 0.18s ease, transform 0.18s ease",
        }} />
      </button>
      {show && coords && ReactDOM.createPortal(
        <div className="no-print" style={{
          position: "fixed", top: coords.top, right: coords.right, zIndex: 1000001,
          background: "#2A2620", color: "#F6F1E4", fontSize: 11.5, fontStyle: "italic",
          fontFamily: "system-ui, sans-serif", padding: "6px 10px", borderRadius: 6,
          whiteSpace: "nowrap", boxShadow: "0 6px 14px rgba(0,0,0,0.25)", pointerEvents: "none",
        }}>
          Last changed by {meta.by}{metaTime ? ` · ${metaTime}` : ""}
        </div>,
        document.body
      )}
    </React.Fragment>
  );
}

// Plain text/number/textarea field with an optional press-and-hold "last
// changed by" badge at its right edge. Used anywhere a single field (not
// the volunteer-name autocomplete) needs its own edit-attribution.
function TextFieldWithMeta({ value, onChange, locked, placeholder, style, meta, multiline, rows, inputMode, align, wrapStyle }) {
  const ref = useRef(null);
  const hasMeta = hasMetaInfo(meta);
  const fieldStyle = hasMeta ? { ...style, paddingRight: 34 } : style;
  return (
    <div style={{ position: "relative", ...(wrapStyle || {}) }}>

        <textarea ref={ref} value={value} onChange={(e) => onChange(e.target.value)}

// volunteer list on its own; that list is only ever edited deliberately
// from Manage Teams.
function VolunteerNameInput({ value, onChange, volunteers, locked, placeholder, style, meta }) {
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState("");
  const [coords, setCoords] = useState(null);
  const wrapRef = useRef(null);
  const inputRef = useRef(null);
  const popupRef = useRef(null);
  const scrollBeforeFocusRef = useRef(null);

  const hasMeta = hasMetaInfo(meta);

  // Mobile browsers like to "help" by auto-scrolling the page the instant an
  // input is focused, even when the input is already fully visible. Remember
  // the scroll position right before focus lands, then on the next frame
  // check whether the browser jumped for no reason and snap back if so.
  const captureScrollBeforeFocus = useCallback(() => {
    scrollBeforeFocusRef.current = window.scrollY;
  }, []);

  const guardScrollOnFocus = useCallback(() => {
    const savedY = scrollBeforeFocusRef.current;
    if (savedY == null) return;
    requestAnimationFrame(() => {
      const el = inputRef.current;
      if (!el) return;
      const vv = window.visualViewport;
      const visibleBottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
      const rect = el.getBoundingClientRect();
      // Still comfortably visible? Then the jump wasn't needed — undo it.
      if (rect.top >= 0 && rect.bottom <= visibleBottom - 8) {
        window.scrollTo(window.scrollX, savedY);
      }
    });
  }, []);

  // If the on-screen keyboard opens later and actually covers the input,
  // nudge the page up by just enough to reveal it (instead of relying on
  // the browser's own overshoot-prone auto-scroll).
  useEffect(() => {
    const vv = window.visualViewport;
    if (!vv) return;
    const handleViewportResize = () => {
      const el = inputRef.current;
      if (!el || document.activeElement !== el) return;
      const rect = el.getBoundingClientRect();
      const visibleBottom = vv.offsetTop + vv.height;
      const overlap = rect.bottom - visibleBottom;
      if (overlap > 0) {
        window.scrollBy(0, overlap + 12);
      }
    };
    vv.addEventListener("resize", handleViewportResize);
    return () => vv.removeEventListener("resize", handleViewportResize);
  }, []);

  // Picks whichever side (below or above the input) has more room, and caps
  // the popup's height to whatever space is actually visible — so on phones
  // it lands above the on-screen keyboard instead of hiding behind it.
  const updateCoords = useCallback(() => {
    const el = inputRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const vv = window.visualViewport;
    const layoutHeight = window.innerHeight;
    const visibleTop = vv ? vv.offsetTop : 0;
    const visibleBottom = vv ? vv.offsetTop + vv.height : layoutHeight;
    const gap = 6;
    const margin = 10;
    const spaceBelow = visibleBottom - rect.bottom - gap - margin;
    const spaceAbove = rect.top - visibleTop - gap - margin;
    const below = spaceBelow >= 120 || spaceBelow >= spaceAbove;
    const maxHeight = Math.max(100, Math.min(240, below ? spaceBelow : spaceAbove));
    setCoords(
      below
        ? { left: rect.left, width: rect.width, top: rect.bottom + gap, bottom: null, maxHeight }
        : { left: rect.left, width: rect.width, top: null, bottom: layoutHeight - rect.top + gap, maxHeight }
    );
  }, []);

  const openList = () => {
    if (locked || (volunteers || []).length === 0) return;
    setSearch("");
    updateCoords();
    setOpen(true);
  };

  useEffect(() => {
    if (!open) return;
    updateCoords();
    const handleOutside = (e) => {
      if (wrapRef.current && wrapRef.current.contains(e.target)) return;
      if (popupRef.current && popupRef.current.contains(e.target)) return;
      setOpen(false);
    };
    document.addEventListener("mousedown", handleOutside);
    window.addEventListener("scroll", updateCoords, true);
    window.addEventListener("resize", updateCoords);
    const vv = window.visualViewport;
    if (vv) {
      vv.addEventListener("resize", updateCoords);
      vv.addEventListener("scroll", updateCoords);
    }
    return () => {
      document.removeEventListener("mousedown", handleOutside);
      window.removeEventListener("scroll", updateCoords, true);
      window.removeEventListener("resize", updateCoords);
      if (vv) {
        vv.removeEventListener("resize", updateCoords);
        vv.removeEventListener("scroll", updateCoords);
      }
    };
  }, [open, updateCoords]);

  const filtered = (volunteers || []).filter((v) => normKey(v).includes(normKey(search)));

  return (
    <div ref={wrapRef} style={{ position: "relative", flex: 1 }}>
      <input
        ref={inputRef}
        value={value}
        onChange={(e) => {
          onChange(e.target.value);
          setSearch(e.target.value);
          if (!locked) { updateCoords(); setOpen(true); }
        }}
        onFocus={() => { openList(); guardScrollOnFocus(); }}
        onClick={openList}
        onMouseDown={captureScrollBeforeFocus}
        onTouchStart={captureScrollBeforeFocus}
        placeholder={placeholder}
        readOnly={locked}
        style={hasMeta ? { ...style, paddingRight: 34 } : style}
        autoComplete="off"
      />
      {hasMeta && <LastChangedBadge meta={meta} anchorRef={inputRef} />}
      {open && !locked && filtered.length > 0 && coords && ReactDOM.createPortal(
        <div ref={popupRef} className="no-print" style={{
          ...styles.suggestPopup,
          left: coords.left, width: coords.width, maxHeight: coords.maxHeight,
          ...(coords.top != null ? { top: coords.top, bottom: "auto" } : { bottom: coords.bottom, top: "auto" }),
        }}>
          {filtered.map((v, i) => (
            <div key={v} className="volunteer-suggest-item"
              style={{ ...styles.suggestItem, borderTop: i === 0 ? "none" : "1px solid rgba(255,255,255,0.16)" }}
              onMouseDown={(e) => { e.preventDefault(); onChange(v); setOpen(false); }}>
              {v}
            </div>
          ))}
        </div>,
        document.body
      )}
    </div>
  );
}

function MasterListView({ config, monthState, updateMonthState, week, slot, year, month }) {
  const [view, setView] = useState("list");
  const [search, setSearch] = useState("");
  const [exporting, setExporting] = useState(null); // null | "image" | "pdf"
  const sheetRef = useRef(null);

  // Phones/tablets get the native share sheet (Messenger, WhatsApp, etc. are
  // registered there); desktop/laptop browsers mostly aren't registered with
  // any chat apps as share targets, so there we skip straight to a normal
  // file download that the user can then attach wherever they like.
  const isMobileDevice = () =>
    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.userAgentData && navigator.userAgentData.mobile);

  // Turns a Blob into either the device's native share sheet (so it can be
  // sent straight to Messenger/a group chat) or, if sharing files isn't
  // supported, a plain file download as a fallback.
  const shareOrDownloadBlob = useCallback(async (blob, filename, mimeType) => {
    try {
      const file = new File([blob], filename, { type: mimeType });
      if (isMobileDevice() && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return; // user cancelled the share sheet
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }, []);

  const exportSheet = useCallback(async (kind, sheetLabel) => {
    const source = sheetRef.current;
    if (!source || !window.html2canvas || exporting) return;
    setExporting(kind);
    let wrapper = null;
    try {
      // Render a real, detached copy of the sheet at a fixed "desktop" width
      // — actually laid out by the browser itself (not a virtual clone deep
      // inside html2canvas), so column proportions come out exactly like a
      // real desktop view/print, never squeezed or oddly stretched. It's
      // parked off-screen so the user's own on-screen view never flickers.
      const CAPTURE_SCALE = 2; // pixel-density multiplier for a crisp raster
      const CONTENT_W = 740; // css px matching the printable width on a letter page
      const clone = source.cloneNode(true);
      clone.style.zoom = "1"; // in case the live sheet was mid print-shrink
      clone.style.width = `${CONTENT_W}px`;
      clone.style.margin = "0";
      wrapper = document.createElement("div");
      wrapper.style.position = "fixed";
      wrapper.style.top = "0";
      wrapper.style.left = "-99999px";
      wrapper.appendChild(clone);
      document.body.appendChild(wrapper);
      // Two animation frames make sure the browser has actually laid out
      // and painted the clone (and the watermark image) before we shoot it.
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

      const rawCanvas = await window.html2canvas(clone, {
        scale: CAPTURE_SCALE,
        backgroundColor: "#FFFFFF",
        useCORS: true,
      });
      document.body.removeChild(wrapper);
      wrapper = null;

      // Compose the raster onto a white "sheet of paper" that is always
      // exactly US Letter size at 300 DPI (2550x3300px), with the same
      // 0.35in margins the print stylesheet uses. The table is stretched
      // to exactly fill the printable area (both width and height), so it
      // always fits the page edge-to-edge instead of leaving blank space
      // above/below when it's shorter than a full page.
      const DPI = 300;
      const pageW = Math.round(8.5 * DPI); // 2550
      const pageH = Math.round(11 * DPI); // 3300
      const margin = Math.round(0.35 * DPI);
      const usableW = pageW - margin * 2;
      const usableH = pageH - margin * 2;
      const drawW = usableW;
      const drawH = usableH;
      const drawX = margin;
      const drawY = margin;

      const canvas = document.createElement("canvas");
      canvas.width = pageW;
      canvas.height = pageH;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, pageW, pageH);
      ctx.drawImage(rawCanvas, drawX, drawY, drawW, drawH);

      const safeName = sheetLabel.replace(/[\\/:*?"<>|]/g, "").trim();
      if (kind === "image") {
        await new Promise((resolve) => {
          canvas.toBlob(async (blob) => {
            if (blob) await shareOrDownloadBlob(blob, `${safeName}.png`, "image/png");
            resolve();
          }, "image/png");
        });
      } else {
        const { jsPDF } = window.jspdf;
        const imgData = canvas.toDataURL("image/jpeg", 0.95);
        const pdf = new jsPDF({ orientation: "portrait", unit: "px", format: [pageW / CAPTURE_SCALE, pageH / CAPTURE_SCALE] });
        pdf.addImage(imgData, "JPEG", 0, 0, pageW / CAPTURE_SCALE, pageH / CAPTURE_SCALE);
        await shareOrDownloadBlob(pdf.output("blob"), `${safeName}.pdf`, "application/pdf");
      }
    } catch (err) {
      if (wrapper && wrapper.parentNode) wrapper.parentNode.removeChild(wrapper);
      console.error(err);
      alert("Hindi na-export. Subukan muli.");
    }
    setExporting(null);
  }, [exporting, shareOrDownloadBlob]);

  // The run sheet's content (main table + side blocks + head count) can be
  // taller than a single printed page once a lot of rows/overrides are in
  // play. Rather than let the browser split it across two pages, shrink the
  // whole sheet down to fit one page's printable area right before printing
  // (both the in-app Print button and Ctrl+P trigger the same browser print
  // flow, so listening for window's print events covers both), then restore
  // it to full size afterward so the on-screen view is unaffected.
  useEffect(() => {
    if (view !== "print") return;
    const PAGE_WIDTH_PX = 740;
    const PAGE_HEIGHT_PX = 980;
    const applyPrintScale = () => {
      const el = sheetRef.current;
      if (!el) return;
      el.style.zoom = "1";
      const contentWidth = el.scrollWidth;
      const contentHeight = el.scrollHeight;
      const scale = Math.min(1, PAGE_WIDTH_PX / contentWidth, PAGE_HEIGHT_PX / contentHeight);
      el.style.zoom = scale < 1 ? scale : "1";
    };
    const resetPrintScale = () => {
      const el = sheetRef.current;
      if (el) el.style.zoom = "1";
    };
    window.addEventListener("beforeprint", applyPrintScale);
    window.addEventListener("afterprint", resetPrintScale);
    return () => {
      window.removeEventListener("beforeprint", applyPrintScale);
      window.removeEventListener("afterprint", resetPrintScale);
    };
  }, [view]);

  const rows = [];
  config.teams.forEach((team) => {
    team.roles.forEach((role) => {
      const key = assignKey(week, slot, team.id, role.id);
      const name = monthState.assignments[key] || "";
      const verse = (monthState.verses && monthState.verses[key]) || "";
      const checked = !!(monthState.checks && monthState.checks[key]);
      const issues = name ? findIssues(config, monthState, week, slot, team.id, role.id, name) : [];
      const meta = (monthState.editMeta && monthState.editMeta[key]) || null;
      rows.push({ key, team, role, name, verse, checked, issues, meta });
    });
  });
  const filled = rows.filter((r) => r.name).length;
  const infoKey = serviceInfoKey(week, slot);
  const info = (monthState.serviceInfo && monthState.serviceInfo[infoKey]) || {};
  const printSettings = config.printSettings || {};
  const dateLabel = weekDisplayLabel(week, monthState.weekLabels, year, month);

  // Search filters (and highlights) rows by team, role, or volunteer name
  // so a long list is quick to scan once there are a lot of volunteers.
  const searchQuery = norm(search);
  const searchLower = searchQuery.toLowerCase();
  const filteredRows = searchQuery
    ? rows.filter((r) =>
        r.team.name.toLowerCase().includes(searchLower) ||
        r.role.name.toLowerCase().includes(searchLower) ||
        r.name.toLowerCase().includes(searchLower))
    : rows;

  // Grouped by team for the simplified mobile card view — avoids repeating
  // "TEAM: Service Lead" on every single line, which is what made the
  // stacked mobile table hard to scan. Rows are already produced team-by-
  // team above, so a team header is inserted whenever the team changes.
  const groupedRows = [];
  let lastTeamId = null;
  filteredRows.forEach((r) => {
    if (r.team.id !== lastTeamId) {
      groupedRows.push({ kind: "team", id: `team-${r.team.id}`, team: r.team });
      lastTeamId = r.team.id;
    }
    groupedRows.push({ kind: "row", id: r.key, row: r });
  });

  const toggleCheck = (key) => {
    updateMonthState((prev) => {
      const nextChecks = { ...(prev.checks || {}) };
      if (nextChecks[key]) delete nextChecks[key];
      else nextChecks[key] = true;
      return { ...prev, checks: nextChecks };
    });
  };

  if (view === "print") {
    const total = [info.headcountVolunteer, info.headcountAdult, info.headcountKids]
      .map((v) => parseInt(v, 10))
      .filter((n) => !isNaN(n))
      .reduce((a, b) => a + b, 0);
    const program = config.printProgram || defaultPrintProgram();
    const timeOffset = slotOffsetMinutes(slot);

    const setCustomValue = (rowId, value) => {
      updateMonthState((prev) => {
        const next = { ...(prev.customValues || {}) };
        const cvKey = `${week}|${slot}|${rowId}`;
        if (norm(value)) next[cvKey] = value;
        else delete next[cvKey];
        return { ...prev, customValues: next };
      });
    };

    const VolunteerCell = ({ row }) => {
      const r = resolvePrintRow(config, monthState, week, slot, row);
      const hasConflict = r.issues.some((x) => x.type === "conflict");
      const hasDup = r.issues.some((x) => x.type === "duplicate");
      if (r.editable) {
        return (
          <input className="no-print-interactive" value={r.value} onChange={(e) => setCustomValue(row.id, e.target.value)}
            placeholder="—" style={{ width: "100%", boxSizing: "border-box", border: "none", background: "transparent", fontSize: 11.5, fontFamily: "system-ui, sans-serif", outline: "none" }} />
        );
      }
      return (
        <span style={{ color: hasConflict ? "#8C2F22" : hasDup ? "#8A6A1A" : "inherit", fontWeight: hasConflict || hasDup ? 700 : 400 }}>
          {r.value || ""}
        </span>
      );
    };

    return (
      <div className="print-sheet-wrap" style={styles.viewWrap}>
        <div className="no-print sheet-toolbar">
          <button onClick={() => setView("list")} style={{ ...styles.smallBtn, whiteSpace: "normal" }}>← Back to list view</button>
          <button onClick={() => window.print()} style={{ ...styles.smallBtn, background: "#A9782F", whiteSpace: "normal" }}>🖨 Print</button>
          <button onClick={() => exportSheet("image", `Master List - ${dateLabel} - ${slot}`)} disabled={!!exporting}
            style={{ ...styles.smallBtn, background: "#2F4858", opacity: exporting && exporting !== "image" ? 0.6 : 1, whiteSpace: "normal" }}>
            {exporting === "image" ? "Ginagawa…" : "🖼 Save as Image"}
          </button>
          <button onClick={() => exportSheet("pdf", `Master List - ${dateLabel} - ${slot}`)} disabled={!!exporting}
            style={{ ...styles.smallBtn, background: "#2F4858", opacity: exporting && exporting !== "pdf" ? 0.6 : 1, whiteSpace: "normal" }}>
            {exporting === "pdf" ? "Ginagawa…" : "📄 Save as PDF"}
          </button>
        </div>
        <div className="sheet-scroll">
        <div className="print-sheet" style={styles.sheet} ref={sheetRef}>
          <div className="print-sheet-watermark" style={styles.sheetWatermark} aria-hidden="true">
            <img src="./icons/VictoryWatermark.png" alt="" style={styles.sheetWatermarkImg} />
          </div>
          <div style={styles.sheetInner}>
          <div style={styles.sheetBannerMain}>{printSettings.churchName || "VICTORY ALFONSO CHURCH SUNDAY SERVICE"}</div>
          <div style={styles.sheetBannerSub}>
            {[printSettings.campus || "VICTORY ALFONSO", printSettings.callTime && `CALLTIME: ${printSettings.callTime}`, `SERVICE TIME: ${slot}`].filter(Boolean).join(" | ")}
          </div>
          {info.series && <div style={styles.sheetBannerBold}>{info.series.toUpperCase()}</div>}
          {(info.topic || info.verse) && <div style={styles.sheetBannerLight}>{[info.topic, info.verse].filter(Boolean).join("   ")}</div>}
          <div style={styles.sheetBannerSub}>{dateLabel}</div>

          <table style={styles.sheetTable}>
            <thead>
              <tr>
                <th style={styles.sheetTh}>Time</th>
                <th style={styles.sheetTh}>Duration</th>
                <th style={styles.sheetTh}>Program</th>
                <th style={styles.sheetTh}>Task</th>
                <th style={styles.sheetTh}>Volunteer(s)</th>
                <th style={{ ...styles.sheetTh, width: 26 }}></th>
              </tr>
            </thead>
            <tbody>
              {program.sections.map((section) => {
                if (section.kind === "divider") {
                  const dividerTiming = resolveRowTiming(section, week, slot, timeOffset);
                  return (
                    <tr key={section.id}>
                      <td style={styles.sheetTd}>{dividerTiming.time}</td>
                      <td colSpan={5} style={styles.sheetBand}>{shiftDividerLabel(section.label, slot)}</td>
                    </tr>
                  );
                }
                const visibleRows = (section.rows || []).filter((row) => rowVisibleForWeek(row, week));
                if (visibleRows.length === 0) return null;
                const extraLines = (section.programSubRoles || [])
                  .map((tag) => resolveRoleTagValue(config, monthState, week, slot, tag))
                  .filter((v) => norm(v));

                return visibleRows.map((row, i) => {
                  const timing = resolveRowTiming(row, week, slot, timeOffset);

                            onChange={() => toggleCheck(`custom:${row.id}`)} />
                        )}
                      </td>
                    </tr>
                  );
                });
              })}
            </tbody>
          </table>

          {(program.sideBlocks || []).length > 0 && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14 }}>
              {program.sideBlocks.map((block) => (
                <div key={block.id}>
                  <div style={styles.sheetSectionHead}>{block.title}</div>
                  <table style={{ ...styles.sheetTable, tableLayout: "fixed", width: "100%" }}>
                    <colgroup>
                      <col style={{ width: "58%" }} />
                      <col />

                    <tbody>
                      {(block.rows || []).map((row) => (
                        <tr key={row.id}>
                          <td style={styles.sheetTd}>{row.label}</td>
                          <td style={styles.sheetTd}><VolunteerCell row={row} /></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14 }}>
            {(program.soloRows || []).length > 0 && (
              <div>
                <table style={{ ...styles.sheetTable, tableLayout: "fixed", width: "100%" }}>
                  <colgroup>
                    <col style={{ width: "40%" }} />
                    <col />
                  </colgroup>
                  <tbody>
                    {program.soloRows.map((row) => (
                      <tr key={row.id}>
                        <td style={{ ...styles.sheetTdTall, background: "#1F3864", color: "#FFFFFF", fontWeight: 700 }}>{row.label.toUpperCase()}</td>
                        <td style={styles.sheetTdTall}><VolunteerCell row={row} /></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            <div>
              <div style={styles.sheetSectionHead}>ANNOUNCEMENTS</div>
              <div style={{ border: "1px solid #23211D", borderTop: "none", padding: "8px 10px", fontSize: 12.5, whiteSpace: "pre-wrap", minHeight: 30 }}>{info.announcements || ""}</div>
            </div>
          </div>

          <div style={{ marginTop: 14, maxWidth: 320 }}>
            <div style={styles.sheetSectionHead}>HEAD COUNT</div>
            <table style={styles.sheetTable}>
              <tbody>
                <tr><td style={styles.sheetTdTall}>Volunteer</td><td style={{ ...styles.sheetTdTall, width: 80 }}>{info.headcountVolunteer || ""}</td></tr>
                <tr><td style={styles.sheetTdTall}>Adult</td><td style={styles.sheetTdTall}>{info.headcountAdult || ""}</td></tr>
                <tr><td style={styles.sheetTdTall}>Kids</td><td style={styles.sheetTdTall}>{info.headcountKids || ""}</td></tr>
                <tr><td style={{ ...styles.sheetTdTall, fontWeight: 700 }}>Total</td><td style={{ ...styles.sheetTdTall, fontWeight: 700 }}>{total || ""}</td></tr>
              </tbody>
            </table>
          </div>
          </div>
        </div>
        </div>
      </div>
    );
  }

  return (
    <div style={styles.viewWrap}>
      <header style={styles.viewHeader}>
        <h1 style={styles.h1}>Master List</h1>
        <div style={styles.viewMeta}>
          {dateLabel} · {slot} · {filled} of {rows.length} roles filled

      </div>
      {(info.series || info.topic || info.verse || info.announcements) && (
        <div style={styles.masterCard}>
          <div style={{ padding: "14px 18px", fontFamily: "system-ui, sans-serif", fontSize: 13.5, display: "flex", flexDirection: "column", gap: 4 }}>
            {info.series && <div><strong>Series:</strong> {info.series}</div>}
            {info.topic && <div><strong>Topic:</strong> {info.topic}</div>}
            {info.verse && <div><strong>Verse:</strong> {info.verse}</div>}
            {info.announcements && <div><strong>Announcements:</strong> {info.announcements}</div>}

      <div style={{ ...styles.masterCard, marginTop: (info.series || info.topic || info.verse || info.announcements) ? 16 : 0 }}>
        <div className="master-table-wrap">

                      {r.name ? (searchQuery ? highlightMatch(r.name, searchQuery) : r.name) : <span style={styles.tdMuted}>— open —</span>}
                      {r.meta && typeof r.meta.at === "number" && formatRelativeTime(r.meta.at) && (
                        <div style={styles.editMetaNoteSm}>{r.meta.by} · {formatRelativeTime(r.meta.at)}</div>
                      )}
                    </td>
                    <td style={styles.td} data-label="Verse">{r.role.hasVerse ? (r.verse || <span style={styles.tdMuted}>—</span>) : <span style={styles.tdMuted}>—</span>}</td>

                      {hasConflict ? <span style={styles.badgeConflict}>Double-booked</span>

                        : r.name ? <span style={styles.badgeOk}>Confirmed</span>
                        : <span style={styles.tdMuted}>—</span>}

        <div className="master-cards">
          {groupedRows.length === 0 && (
            <div style={styles.emptyNote}>No teams, roles, or volunteers match "{searchQuery}".</div>

            if (g.kind === "team") {
              return <div key={g.id} style={styles.mcTeamHeader}>{searchQuery ? highlightMatch(g.team.name, searchQuery) : g.team.name}</div>;
            }
            const r = g.row;
            const hasConflict = r.issues.some((x) => x.type === "conflict");
            const hasDup = r.issues.some((x) => x.type === "duplicate");
            const statusColor = hasConflict ? "#8C2F22" : hasDup ? "#8A6A1A" : r.name ? "#385026" : "#B0A582";
            return (
              <div key={g.id} style={styles.mcRow}>
                <div style={styles.mcRoleCol}>
                  <div style={styles.mcRoleName}>{searchQuery ? highlightMatch(r.role.name, searchQuery) : r.role.name}</div>
